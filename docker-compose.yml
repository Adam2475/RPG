services:
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/life_rpg.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
    volumes:
      - life-rpg-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  life-rpg-data:
